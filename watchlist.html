<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlist - CINEMATCH</title>
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="logo">CINEMATCH</span>
          <nav class="top-nav">
            <a class="nav-item" href="home.html">Film</a>
            <a class="nav-item active" href="watchlist.html">Watchlist</a>
          </nav>
        </div>
        <div class="user-actions">
          <div class="avatar" id="avatar">U</div>
          <span class="user-name" id="user-name">User</span>
          <a href="#" class="logout" id="logout-btn">Logout</a>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <h2 class="section-title">Watchlist Saya</h2>
      <div class="filter-row watchlist-filter">
        <button class="chip active" data-filter="all">Semua</button>
        <button class="chip" data-filter="unwatched">Belum Ditonton</button>
        <button class="chip" data-filter="watched">Sudah Ditonton</button>
      </div>
      <div id="watchlist-grid" class="movies-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span> CINEMATCH</div>
    </footer>

    <script type="module" src="js/watchlist.js"></script>
  </body>
</html>
