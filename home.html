<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CINEMATCH</title>
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="logo">CINEMATCH</span>
          <nav class="top-nav">
            <a class="nav-item active" href="javascript:void(0)" data-section="film">Film</a>
            <a class="nav-item" href="watchlist.html">Watchlist</a>
          </nav>
        </div>
        <div class="user-actions">
          <div class="avatar" id="avatar">U</div>
          <span class="user-name" id="user-name">User</span>
          <a href="#" class="logout" id="logout-btn">Logout</a>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <div id="film-section">
        <div class="search-row">
          <input
            id="search"
            class="search-input"
            placeholder="Cari film..."
          />
          <div class="controls">
            <select id="genre" class="genre-select">
              <option value="all">Semua Genre</option>
            </select>
            <button id="searchBtn" class="btn">Cari</button>
          </div>
        </div>

        <div class="filter-row">
          <button class="chip active" data-mode="now_playing">Tayang</button>
          <button class="chip" data-mode="popular">Popular</button>
          <button class="chip" data-mode="top_rated">Top Rated</button>
        </div>

        <div id="movies-container" class="movies-grid"></div>

        <button id="load-more" class="btn load-more hidden">Muat Lainnya</button>
      </div>

    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span> CINEMATCH</div>
    </footer>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
